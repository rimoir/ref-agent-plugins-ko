# 저장소 소유자가 PR 코멘트나 줄 코멘트에 `@claude <지시>`를 쓰면 Claude가 고쳐 push하고 리뷰를 다시 부른다.
name: "@claude"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # 공개 저장소라 소유자만 부를 수 있다.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.issue.pull_request || github.event.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: gh pr checkout "$PR"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 테스트 도구
        run: |
          corepack enable
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pandas
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-opus-5-5 --effort xhigh --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
      - name: 사용량
        if: always() && steps.claude.outputs.execution_file
        continue-on-error: true
        run: git show origin/main:tools/usage-summary.py | python3 - "${{ steps.claude.outputs.execution_file }}" "@claude PR ${{ env.PR }}" >> "$GITHUB_STEP_SUMMARY"
      - name: 재리뷰
        if: steps.claude.outcome == 'success'
        # 사람 지시로 고친 뒤에는 자동 수정 없이 리뷰만 한다.
        run: gh workflow run review.yml -f pr="$PR" -f round=2
