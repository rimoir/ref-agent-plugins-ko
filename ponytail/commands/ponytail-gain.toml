description = "ponytail의 측정된 효과 점수표를 보여 준다 (코드, 비용, 시간 감소)"
prompt = "ponytail gain 점수표를 보여 준다. 일회성이며 아무것도 바꾸지 않는다. 모드를 바꾸거나, 플래그 파일을 쓰거나, 무엇이든 저장하지 마라. 공개된 벤치마크 중앙값을 일반 ASCII 막대로 그린다. 중앙값은 일상 작업 5개를 Haiku, Sonnet, Opus 모델로 측정한 값이고, 출처는 benchmarks/와 README다. 코드 줄 수: 스킬 없음 100% 대 ponytail 6-20%(80-94% 감소). 비용: 스킬 없음 100% 대 ponytail 23-53%(47-77% 감소). 속도: ponytail 3-6배 빠름. 막대 길이는 측정된 범위를 보여 주고, 이름표에는 정확한 수치를 적는다. 이 수치는 이 저장소가 아니라 벤치마크의 중앙값이다. 저장소별 절감 수치는 절대 출력하지 마라. 만들지 않은 버전은 실제로 작성된 적이 없으므로, 실제 저장소에는 빼서 비교할 진짜 기준값이 없다. 저장소별 실제 수치가 필요하면 /ponytail-debt(개수를 센 단순화 부채 목록)와 /ponytail-audit(아직 줄일 수 있는 것)를 안내한다. 보고만 한다."
