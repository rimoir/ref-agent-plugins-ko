# 3일마다 upstream 변경을 찾아 플러그인마다 번역 갱신 PR을 연다.
# 필요한 시크릿: CLAUDE_CODE_OAUTH_TOKEN (로컬에서 `claude setup-token`)
# 저장소 설정: Actions의 PR 생성 허용, auto-merge, main ruleset(필수 검사 verify, review)
name: upstream 번역 갱신

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "이 플러그인만 처리 (비우면 전부)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write  # review.yml을 workflow_dispatch로 부른다

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 tools/check-updates.py > updates.jsonl
          cat updates.jsonl
          # 같은 갱신의 브랜치가 이미 있으면(PR이 열려 있으면) 건너뛴다.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          out = []
          for line in open("updates.jsonl"):
              u = json.loads(line)
              if os.environ["ONLY"] and u["name"] != os.environ["ONLY"]:
                  continue
              u["branch"] = f"i18n/{u['name']}-{u['to']}"
              if subprocess.run(["git", "ls-remote", "--exit-code", "--heads", "origin", u["branch"]],
                                capture_output=True).returncode == 0:
                  continue
              out.append(u)
          print("matrix=" + json.dumps({"include": out}))
          PY

  translate:
    needs: detect
    if: fromJSON(needs.detect.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1  # 구독 사용량이 한꺼번에 몰리지 않게 한다
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git switch -c "${{ matrix.branch }}"
      - name: upstream 클론
        run: git clone --quiet "https://github.com/${{ matrix.repo }}" "$RUNNER_TEMP/upstream"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            AGENTS.md를 끝까지 읽고 "갱신 절차" 3~6단계를 따라 `${{ matrix.name }}/` 번역을 갱신한다.
            - 기준: sources.json의 ${{ matrix.name }}.ref = ${{ matrix.from }}
            - 새 버전: ${{ matrix.to }}
            - upstream 클론: ${{ runner.temp }}/upstream (전체 히스토리)
            `${{ matrix.name }}/`와 sources.json만 고친다. 커밋하지 않는다.
            마지막에 `python3 tools/render.py`와 `python3 tools/verify.py ${{ matrix.name }}`를 돌려 통과시킨다.
            갱신하지 않고 멈추는 경우에는 이유를 `${{ runner.temp }}/pr.md`에 쓰고 끝낸다.
            끝나면 PR 본문으로 쓸 내용(반영 범위, 구조 변경, 판단이 필요했던 곳)을 `${{ runner.temp }}/pr.md`에 쓴다.
          show_full_output: true
          claude_args: >-
            --model claude-opus-5-5 --effort xhigh --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
      - name: 사용량
        if: always() && steps.claude.outputs.execution_file
        run: python3 tools/usage-summary.py "${{ steps.claude.outputs.execution_file }}" "번역 ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: 검증
        run: |
          python3 tools/render.py --check
          python3 tools/verify.py "${{ matrix.name }}"
      - name: 커밋과 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::바뀐 것이 없다"; cat "$RUNNER_TEMP/pr.md" 2>/dev/null; exit 1; }
          to="${{ matrix.to }}"; case "${{ matrix.track }}:$to" in main:*) to="main $to";; *:v*) ;; *) to="v$to";; esac
          title="docs(${{ matrix.name }}): 한국어 번역 갱신 (upstream $to)"
          git commit -q -m "$title" -m "${{ matrix.from }}..${{ matrix.to }}"
          git push -u origin "${{ matrix.branch }}"
          body="$RUNNER_TEMP/pr.md"; [ -f "$body" ] || echo "${{ matrix.from }}..${{ matrix.to }}" > "$body"
          url=$(gh pr create --title "$title" --body-file "$body")
          # GITHUB_TOKEN으로 연 PR은 pull_request 워크플로를 깨우지 못하니 리뷰를 직접 부른다.
          gh workflow run review.yml -f pr="${url##*/}"
