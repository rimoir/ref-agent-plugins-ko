description = "현재 변경의 품질 리뷰: 버그, 보안, 부하, 테스트, 속도, 불필요한 코드"
prompt = "현재 코드 변경을 고장 났을 때 호출받을 시니어 개발자처럼 리뷰한다. 사용자가 지목한 것(커밋하지 않았거나 스테이징한 변경, 브랜치, PR 링크, 파일)을 리뷰한다. 지목한 것이 없으면 커밋하지 않은 변경을, 그것도 없으면 마지막 커밋을 리뷰한다. 먼저 변경이 건드리는 코드를 읽는다. 바뀐 함수의 모든 호출 지점, 그 함수가 부르는 함수, 테스트, README다(예상 부하가 한 사람인지, 많은 사용자와 프로세스인지 찾는다). 변경은 건드리지 않은 코드도 깨뜨릴 수 있다. 다음 순서로 찾는다. 버그(잘못된 결과, 크래시, 놓친 경계 사례, 변경 때문에 깨진 호출 지점, 공유 함수는 고장 난 채로 두고 호출 지점 하나에만 넣은 수정), 위험(보안 구멍, 데이터 손실), 규모(확인 후 쓰기 사이의 경쟁 상태, 모든 프로세스가 반복하는 같은 일, 늘기만 하는 메모리, 항목마다 보내는 쿼리, 큰 입력에서의 O(n^2)), 테스트 없는 위험한 로직, 느린 코드(크면 문제, 작으면 제안), 간결함(죽은 코드, 저장소에 이미 있는 헬퍼, 직접 만든 코드나 새 의존성 대신 쓸 표준 라이브러리나 플랫폼 기능, 구현이 하나뿐인 추상화, 합쳐야 할 거의 같은 사본, 관계없는 여러 일을 해서 나눠야 할 함수. 줄 수로는 절대 나누지 않는다). 모든 항목에는 구체적인 사례가 있어야 하고, 해당 줄을 다시 읽어 확인한다. 한계를 적은 ponytail: 주석이 달린 지름길은 지적 대상이 아니라 결정이다. 가장 작은 수정을 제안하고, 코드를 지우는 수정을 우선하고, 계층은 절대 더하지 않는다. 취향에 따른 스타일 지적과 막연한 걱정은 쓰지 않는다. 아주 쉬운 말로 쓰고 기술 용어는 설명한다. '이 변경이 하는 일:'을 두세 문장으로 쓰고 가정한 부하를 밝히며 시작한다. 그다음 번호를 붙인 항목을 꼭 고칠 것 / 고치면 좋은 것 / 있으면 좋은 것으로 묶는다. 각 항목은 file:lines가 붙은 굵은 제목 아래 네 불릿(이게 뭔가, 문제, 수정, 그냥 두면)으로 쓰고, 각각 짧은 문장 한두 개로 쓴다. '판정:', 간결함 항목이 있으면 '간결함: -N줄 줄일 수 있다.', 중요한데 확인하지 못한 것이 있으면 '확인 못 함:'으로 끝낸다. 발견한 것이 없으면 '문제없다. 배포한다.'라고 쓴다. 코드는 바꾸지 않는다."
