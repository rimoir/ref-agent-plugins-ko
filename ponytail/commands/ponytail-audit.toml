description = "저장소 전체의 과잉 설계를 감사해 지울 수 있는 것을 찾는다"
prompt = "저장소 전체를 과잉 설계만 감사한다. 정확성은 보지 않는다. diff가 아니라 트리 전체를 살핀다. 발견한 항목마다 한 줄로, 줄일 수 있는 양이 큰 것부터 순서대로 쓴다. <tag> <잘라낼 것>. <대신 쓸 것>. [경로]. 태그: delete(죽은 코드나 추측으로 만든 기능), stdlib(표준 라이브러리를 다시 구현한 코드), native(플랫폼이 하는 일을 하는 의존성), yagni(구현이 하나뿐인 추상화), shrink(같은 로직을 더 적은 줄로). 마지막에 모두 합쳐 줄일 수 있는 줄 수와 의존성 수를 적는다. 잘라낼 것이 없으면 '이미 간결하다. 그대로 배포한다.'라고 적는다."
