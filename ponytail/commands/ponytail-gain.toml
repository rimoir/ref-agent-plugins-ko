description = "ponytail의 측정된 효과 점수표를 보여 준다 (코드, 비용, 시간 감소)"
prompt = "ponytail gain 점수표를 보여 준다. 일회성이며 아무것도 바꾸지 않는다. 모드를 바꾸거나, 플래그 파일을 쓰거나, 무엇이든 저장하지 마라. 공개된 에이전트 벤치마크 평균을 일반 ASCII 막대로 그린다. 평균은 실제 FastAPI + React 저장소의 기능 작업 12개를 Haiku 4.5로 작업마다 4번씩 돌려 낸 값이고, 스킬 없는 같은 에이전트와 비교했다. 출처는 benchmarks/results/2026-06-18-agentic.md와 README다. 스킬 없는 기준(100%) 대비 ponytail의 비율로 나타낸다. 코드 줄 수 46%(54% 감소). 토큰 78%(22% 감소). 비용 80%(20% 감소). 시간 73%(27% 감소). 안전성 100% 유지. 막대 길이는 비율을 보여 주고, 이름표에는 정확한 수치를 적는다. 이 수치는 이 저장소가 아니라 벤치마크의 평균이다. 저장소별 절감 수치는 절대 출력하지 마라. 만들지 않은 버전은 실제로 작성된 적이 없으므로, 실제 저장소에는 빼서 비교할 진짜 기준값이 없다. 저장소별 실제 수치가 필요하면 /ponytail-debt(개수를 센 단순화 부채 목록)와 /ponytail-audit(아직 줄일 수 있는 것)를 안내한다. 보고만 한다."
